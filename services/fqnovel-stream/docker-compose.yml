services:
  fqnovel-stream:
    build: .
    container_name: fqnovel-stream
    network_mode: host
    restart: unless-stopped
    environment:
      FQNOVEL_UPSTREAM: http://127.0.0.1:9999
      AUDIO_CACHE_DIR: /var/cache/fqnovel-audio
      STREAM_HOST: 127.0.0.1
      STREAM_PORT: 9998
      MAX_CACHE_BYTES: "21474836480"
      WARM_WORKERS: "2"
      STREAM_API_TOKEN: "${STREAM_API_TOKEN:-}"
      FQNOVEL_API_TOKEN: "${FQNOVEL_API_TOKEN:-}"
    volumes:
      - fqnovel_audio_cache:/var/cache/fqnovel-audio

volumes:
  fqnovel_audio_cache:
